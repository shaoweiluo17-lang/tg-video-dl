[project]
name = "tg-video-dl"
version = "0.4.6"
description = "Telegram 收藏夹转发即下载（fnOS fpk 应用）"
requires-python = ">=3.11"

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "telethon>=1.36",
    "python-socks[asyncio]>=2.4",
    "cryptg>=0.4",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "cryptography>=42",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "deploy/fpk/app/bin"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
